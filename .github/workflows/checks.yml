name: Code Quality Checks

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-locked-ha:
    runs-on: ubuntu-latest
    name: Test against locked HA
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Show Python version
        run: python --version

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests with coverage
        run: uv run pytest --cov=custom_components/komfovent --cov-branch --cov-report=xml --cov-report=term --junitxml=junit.xml -o junit_family=legacy

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  test-minimum-ha:
    runs-on: ubuntu-latest
    name: Test against minimum HA
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Read minimum Home Assistant version
        id: min
        run: echo "version=$(jq -r .homeassistant hacs.json)" >> "$GITHUB_OUTPUT"

      - name: Install minimum Home Assistant
        run: uv add --dev "homeassistant==${{ steps.min.outputs.version }}" "pytest-homeassistant-custom-component>=0.13"

      - name: Run tests
        run: uv run pytest -p no:cacheprovider
