name: Code Quality Checks

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-unittest:
    runs-on: ubuntu-latest
    name: Run unit tests
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Show Python version
        run: python --version

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests with coverage
        run: uv run pytest --cov=custom_components/komfovent --cov-branch --cov-report=xml --cov-report=term --junitxml=junit.xml -o junit_family=legacy

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  run-unittest-min-ha:
    runs-on: ubuntu-latest
    name: Run unit tests (minimum Home Assistant from hacs.json)
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Read minimum Home Assistant version
        id: min
        run: echo "version=$(jq -r .homeassistant hacs.json)" >> "$GITHUB_OUTPUT"

      # Each pytest-homeassistant-custom-component release pins one exact
      # homeassistant version, but not every patch release gets one. Pick the
      # lowest release pinning a patch in the minimum's series (~=); the floor
      # keeps the resolver away from ancient releases that pin nothing.
      - name: Install dependencies pinned to minimum Home Assistant
        run: |
          uv sync --dev
          uv pip install --resolution lowest-direct \
            "homeassistant~=${{ steps.min.outputs.version }}" \
            "pytest-homeassistant-custom-component>=0.13"

      - name: Verify installed Home Assistant version
        run: |
          uv run --no-sync python - "${{ steps.min.outputs.version }}" <<'EOF'
          import sys
          from importlib.metadata import requires, version

          minimum = sys.argv[1]
          ha = version("homeassistant")
          phcc = version("pytest-homeassistant-custom-component")
          print(f"Minimum {minimum}: installed homeassistant {ha}, phcc {phcc}")
          if ha.split(".")[:2] != minimum.split(".")[:2]:
              sys.exit(f"homeassistant {ha} is outside the {minimum} series")
          if f"homeassistant=={ha}" not in requires(
              "pytest-homeassistant-custom-component"
          ):
              sys.exit(f"phcc {phcc} does not pin homeassistant=={ha}")
          EOF

      # --no-sync keeps uv from reverting to the versions in uv.lock
      - name: Run tests
        run: uv run --no-sync pytest -p no:cacheprovider
